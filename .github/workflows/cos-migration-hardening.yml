name: Tencent COS migration hardening

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feat/tencent-cos-migration-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Apply reviewed migration safety fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('server/scripts/cos_migration.py')
          text = core.read_text(encoding='utf-8')
          text = text.replace('import os\nimport tempfile\n', 'import os\nimport re\nimport tempfile\n')
          old = '''        if target and parsed.hostname.endswith(".myqcloud.com"):\n            expected = f"cos.{self.region}.myqcloud.com"\n            if parsed.hostname != expected:\n                raise MigrationConfigurationError("目标 COS Endpoint 与 Region 不一致")\n'''
          new = '''        if target:\n            expected = f"cos.{self.region}.myqcloud.com"\n            if parsed.hostname != expected:\n                raise MigrationConfigurationError("目标必须使用与 Region 一致的腾讯云 COS Endpoint")\n            if self.addressing_style != "virtual":\n                raise MigrationConfigurationError("目标腾讯云 COS 必须使用 virtual 寻址")\n            if not re.fullmatch(r"[a-z0-9][a-z0-9-]{1,49}-\\d{5,}", self.bucket):\n                raise MigrationConfigurationError("目标 COS Bucket 必须使用 BucketName-APPID 完整名称")\n'''
          if old not in text:
              raise SystemExit('target validation anchor not found')
          text = text.replace(old, new, 1)
          old_append = '''    def append(self, record: dict[str, object]) -> None:\n        safe = dict(record)\n'''
          new_append = '''    def append(self, record: dict[str, object]) -> None:\n        safe = {"schemaVersion": 1, **record}\n'''
          if old_append not in text:
              raise SystemExit('manifest append anchor not found')
          text = text.replace(old_append, new_append, 1)
          core.write_text(text, encoding='utf-8')

          runbook = Path('docs/22-腾讯云COS迁移与权限操作手册.md')
          docs = runbook.read_text(encoding='utf-8')
          docs = docs.replace('uv run python scripts/migrate_storage_to_cos.py', 'uv run python -m scripts.migrate_storage_to_cos')
          runbook.write_text(docs, encoding='utf-8')

          dockerfile = Path('server/Dockerfile')
          docker = dockerfile.read_text(encoding='utf-8')
          docker = docker.replace(
              'python -c "from scripts.migrate_storage_to_cos import build_parser; assert build_parser()"',
              'python -m scripts.migrate_storage_to_cos --help >/dev/null',
          )
          dockerfile.write_text(docker, encoding='utf-8')

          tests = Path('server/tests/test_cos_migration.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''def test_cli_does_not_accept_secret_command_line_arguments() -> None:\n'''
          addition = '''def test_target_requires_official_cos_endpoint_virtual_addressing_and_full_bucket() -> None:\n    base = _location("target")\n\n    with pytest.raises(Exception, match="腾讯云 COS Endpoint"):\n        S3Location(\n            **{**base.__dict__, "endpoint_url": "https://s3.example.com"}\n        ).validate(target=True)\n    with pytest.raises(Exception, match="virtual"):\n        S3Location(\n            **{**base.__dict__, "addressing_style": "path"}\n        ).validate(target=True)\n    with pytest.raises(Exception, match="BucketName-APPID"):\n        S3Location(\n            **{**base.__dict__, "bucket": "oral-media"}\n        ).validate(target=True)\n\n\ndef test_manifest_records_include_schema_version(tmp_path: Path) -> None:\n    manifest = Manifest(tmp_path / "manifest.jsonl")\n    manifest.append({"key": "a.mp4", "status": "copied"})\n\n    record = json.loads((tmp_path / "manifest.jsonl").read_text())\n    assert record["schemaVersion"] == 1\n\n\n'''
          if marker not in test_text:
              raise SystemExit('test insertion anchor not found')
          test_text = test_text.replace(marker, addition + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
          uv sync --directory server --extra dev --frozen
          uv run --directory server ruff format scripts tests/test_cos_migration.py
          rm .github/workflows/cos-migration-hardening.yml
          git config user.name 'chatgpt-development'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(storage): harden Tencent COS migration boundaries'
          git push origin HEAD:${{ github.head_ref }}
