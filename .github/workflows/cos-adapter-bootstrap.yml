name: Tencent COS adapter bootstrap

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/tencent-cos-adapter-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Apply reviewed COS adapter patch
        run: |
          uv sync --directory server --extra dev --frozen
          pnpm install --frozen-lockfile
          python scripts/apply_tencent_cos_adapter_p0.py
          uv run --directory server ruff format app tests
          pnpm exec prettier --write server/.env.example server/.env.production.example
          rm scripts/apply_tencent_cos_adapter_p0.py
          rm .github/workflows/cos-adapter-bootstrap.yml
          git config user.name 'chatgpt-development'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(storage): add Tencent COS production adapter'
          git push origin HEAD:${{ github.head_ref }}
