name: Production deployment Python lint fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/tencent-production-deployment-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Normalize deployment contract tests
        run: |
          uv sync --directory server --extra dev --frozen
          uv run --directory server ruff check tests/test_frontend_docker_context.py tests/test_gateway_release_contract.py tests/test_production_deployment_contract.py --fix
          uv run --directory server ruff format tests/test_frontend_docker_context.py tests/test_gateway_release_contract.py tests/test_production_deployment_contract.py
          uv run --directory server ruff check tests/test_frontend_docker_context.py tests/test_gateway_release_contract.py tests/test_production_deployment_contract.py
          rm .github/workflows/production-python-lint-fix.yml
          git config user.name 'chatgpt-development'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'style(deploy): normalize production contract tests'
          git push origin HEAD:${{ github.head_ref }}
