name: Tencent COS ruff fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/tencent-cos-adapter-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Fix import order and remove workflow
        run: |
          uv sync --directory server --extra dev --frozen
          uv run --directory server ruff check app/core/config.py --fix
          rm .github/workflows/cos-ruff-fix.yml
          git config user.name 'chatgpt-development'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'style(storage): normalize COS adapter imports'
          git push origin HEAD:${{ github.head_ref }}
