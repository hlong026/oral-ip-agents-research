name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  quality-gates:
    name: 系统收口质量门禁
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oral
          POSTGRES_PASSWORD: oral_ci_pass
          POSTGRES_DB: oral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oral -d oral_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: 1. 依赖锁与安装
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          uv lock --check --directory server
          uv sync --directory server --extra dev --frozen
          pnpm install --frozen-lockfile
      - name: 临时应用封面全时间轴补丁
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/cover-full-timeline-p0'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python scripts/apply_cover_timeline_patch.py
          uv run --directory server ruff format app/modules/pipeline/cover_timeline.py app/modules/pipeline/router.py app/modules/pipeline/schemas.py tests/test_cover_timeline.py
          pnpm exec prettier --write apps/web/src/pages/EditorPage.tsx apps/web/src/__tests__/EditorPage.test.tsx
          APP_ENV=test DATABASE_URL=sqlite+aiosqlite:///./ci_cover_openapi.db IM_ENABLED=true DOUYIN_IM_APP_KEY=test-openapi-app-key uv run --directory server uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break || sleep 1
          done
          node scripts/gen-api-types.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cover): support full timeline frame selection"
          git push origin "HEAD:$HEAD_REF"
      - name: 2. 数据库迁移链
        working-directory: server
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://oral:oral_ci_pass@127.0.0.1:5432/oral_ci
        run: |
          uv run python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; heads=ScriptDirectory.from_config(Config("alembic.ini")).get_heads(); assert len(heads) == 1, heads'
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic downgrade f2b3c4d5e6f7
          uv run alembic upgrade head
      - name: 3. Ruff
        working-directory: server
        run: uv run ruff check .
      - name: 4. Ruff 格式
        working-directory: server
        run: uv run ruff format --check .
      - name: 5. Mypy
        working-directory: server
        run: uv run mypy app
      - name: 6. Pytest
        working-directory: server
        env:
          APP_ENV: test
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --junitxml=pytest-results.xml 2>&1 | tee pytest.log
      - name: 上传后端测试诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: |
            server/pytest.log
            server/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: 7. OpenAPI 契约零漂移
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./ci_openapi.db
          IM_ENABLED: "true"
          DOUYIN_IM_APP_KEY: test-openapi-app-key
        run: |
          uv run --directory server uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz
          if ! node scripts/gen-api-types.mjs --check; then
            node scripts/gen-api-types.mjs
            exit 1
          fi
      - name: 上传 OpenAPI 漂移诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-diagnostics
          path: |
            server/openapi.snapshot.json
            packages/types/src/generated.ts
          if-no-files-found: error
          retention-days: 7
      - name: 8. 前端格式
        run: pnpm lint
      - name: 9. 前端类型检查
        run: pnpm typecheck
      - name: 10. 前端测试
        run: pnpm test
      - name: 11. 前端构建
        run: pnpm build
      - name: 12. 生产依赖安全审计
        run: |
          uv run --directory server --with pip-audit==2.10.0 pip-audit --local
          pnpm audit --prod --audit-level high
      - name: 13. 容器部署契约
        run: |
          cp server/.env.example server/.env
          docker compose config --quiet
          docker build -f server/Dockerfile -t oral-ip-server:ci .
      - name: 14. 秘密扫描
        run: node scripts/scan-secrets.mjs
