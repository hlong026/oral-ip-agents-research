name: Tencent COS migration format all

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/tencent-cos-migration-p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Format migration code and tests
        run: |
          uv sync --directory server --extra dev --frozen
          uv run --directory server ruff format scripts tests/test_cos_migration*.py
          rm .github/workflows/cos-migration-format-all.yml
          git config user.name 'chatgpt-development'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'style(storage): format COS migration suite'
          git push origin HEAD:${{ github.head_ref }}
