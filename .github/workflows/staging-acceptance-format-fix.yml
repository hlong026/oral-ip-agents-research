name: Staging acceptance format fix

on:
  push:
    branches:
      - feat/staging-backup-acceptance-p0
    paths:
      - .github/workflows/staging-acceptance-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/staging-backup-acceptance-p0
      - uses: astral-sh/setup-uv@v5
      - name: Format and remove temporary workflow
        run: |
          set -eu
          cd server
          uv sync --extra dev --frozen
          uv run ruff format \
            scripts/database_backup.py \
            scripts/database_restore_staging.py \
            scripts/acceptance_report.py \
            scripts/staging_preflight.py \
            tests/test_acceptance_report.py \
            tests/test_database_backup_restore_contract.py \
            tests/test_production_acceptance_contract.py \
            tests/test_staging_preflight_contract.py
          cd ..
          rm .github/workflows/staging-acceptance-format-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server .github/workflows/staging-acceptance-format-fix.yml
          git commit -m "style(staging): format backup and acceptance Python files"
          git push origin HEAD:feat/staging-backup-acceptance-p0
