[project]
name = "oral-server"
version = "0.1.0"
description = "口播IP智能体后端 — FastAPI 模块化单体"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "redis>=5.2",
    "dramatiq[redis]>=2.2,<3",
    "httpx>=0.28",
    "tenacity>=9.0",
    "PyJWT>=2.10,<3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.19",
    "aiofiles>=24.1",
    "structlog>=24.0",
    "cryptography>=44.0",
    "websockets>=14.0",
    "protobuf>=4.25",
    # 发布模块：浏览器自动化（social-auto-upload 集成）
    "patchright>=1.58",
    "qrcode>=8.0",
    "segno>=1.6",
    "opencv-python-headless>=4.10",
    # 封面自动生成（14 号方案 §3.5）：Pillow 绘制模板层
    "pillow>=11.0",
    "boto3>=1.43.52",
    "loguru>=0.7.3",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-aiofiles>=24.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：Depends/File/Form 等作为参数默认值是框架约定，非 bug
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
"app/providers/im/proto/**/*_pb2.py" = ["E501", "I001", "UP009"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
