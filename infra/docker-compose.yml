# 口播IP智能体 — 本地开发编排（不得直接用于生产）
# 起步：PG16 + Redis7 + MinIO；生产部署遵循 docs/operations/16-生产切换上线检查清单.md
services:
  postgres:
    image: postgres:16-alpine
    container_name: oral-postgres
    environment:
      POSTGRES_USER: oral
      POSTGRES_PASSWORD: oral_dev_pass
      POSTGRES_DB: oral
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oral"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oral-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: oral-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oral
      MINIO_ROOT_PASSWORD: oral_dev_minio
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: oral-server
    env_file:
      - ../server/.env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://oral:oral_dev_pass@postgres:5432/oral
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      PUBLISH_BROWSER_HEADLESS: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - oral-storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: dramatiq app.workers.tasks --processes 2 --threads 1
    env_file:
      - ../server/.env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://oral:oral_dev_pass@postgres:5432/oral
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      PUBLISH_BROWSER_HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - oral-storage:/app/storage

  im-listener:
    profiles: ["im-research"]
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: python -m app.workers.im_listener
    env_file:
      - ../server/.env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://oral:oral_dev_pass@postgres:5432/oral
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      PUBLISH_BROWSER_HEADLESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - oral-storage:/app/storage

volumes:
  pg-data:
  redis-data:
  minio-data:
  oral-storage:
