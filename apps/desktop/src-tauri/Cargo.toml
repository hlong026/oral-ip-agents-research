[package]
name = "oral-ip-desktop"
version = "0.1.0"
description = "口播IP智能体桌面壳"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "oral_ip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
