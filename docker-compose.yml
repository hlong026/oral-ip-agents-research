# 口播IP智能体 — 基础设施（06 文档 §6.1 数据层）
# 本地联调：前端 localhost:5173/5174 → API localhost:8000 → PG/Redis/MinIO/Worker
services:
  postgres:
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    container_name: oral-postgres
    environment:
      POSTGRES_USER: oral
      POSTGRES_PASSWORD: oral_dev_pass
      POSTGRES_DB: oral
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oral"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: oral-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: oral-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oral
      MINIO_ROOT_PASSWORD: oral_dev_minio
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: oral-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: oral
      MINIO_ROOT_PASSWORD: oral_dev_minio
      S3_BUCKET: oral-media
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      printf 'oral-container-media' >/tmp/media-probe.txt &&
      mc cp /tmp/media-probe.txt local/$$S3_BUCKET/e2e/probe.txt
      "

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: oral-migrate
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://oral:oral_dev_pass@postgres:5432/oral
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: oral
      S3_SECRET_KEY: oral_dev_minio
      S3_BUCKET: oral-media
      STORAGE_DRIVER: s3
      LOCAL_STORAGE_DIR: /app/storage
      PUBLISH_BROWSER_HEADLESS: "true"
      PUBLISH_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: oral-server
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://oral:oral_dev_pass@postgres:5432/oral
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: oral
      S3_SECRET_KEY: oral_dev_minio
      S3_BUCKET: oral-media
      STORAGE_DRIVER: s3
      LOCAL_STORAGE_DIR: /app/storage
      PUBLISH_BROWSER_HEADLESS: "true"
      PUBLISH_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    shm_size: "1gb"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    volumes:
      - oral-storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: dramatiq app.workers.tasks --processes 1 --threads 4
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://oral:oral_dev_pass@postgres:5432/oral
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: oral
      S3_SECRET_KEY: oral_dev_minio
      S3_BUCKET: oral-media
      STORAGE_DRIVER: s3
      LOCAL_STORAGE_DIR: /app/storage
      PUBLISH_BROWSER_HEADLESS: "true"
      PUBLISH_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    shm_size: "1gb"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - oral-storage:/app/storage

  im-listener:
    profiles: ["im"]
    build:
      context: .
      dockerfile: server/Dockerfile
    command: python -m app.workers.im_listener
    env_file:
      - path: ./server/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://oral:oral_dev_pass@postgres:5432/oral
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: oral
      S3_SECRET_KEY: oral_dev_minio
      S3_BUCKET: oral-media
      STORAGE_DRIVER: s3
      LOCAL_STORAGE_DIR: /app/storage
      PUBLISH_BROWSER_HEADLESS: "true"
      PUBLISH_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - oral-storage:/app/storage

volumes:
  pg-data:
  redis-data:
  minio-data:
  oral-storage:
